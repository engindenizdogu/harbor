# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Edd's Knowledge Base"
  pageTitleSuffix: " | Edd's Knowledge Base"
  enableSPA: true
  enablePopovers: false
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: engindenizdogu.github.io/harbor
  ignorePatterns:
    - private
    - _Private
    - templates
    - Templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Figtree
      body: Manrope
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f2f5fa"
        lightgray: "#dfe5ee"
        gray: "#8792a2"
        darkgray: "#2a3b4f"
        dark: "#1b2227"
        secondary: "#026fd4"
        tertiary: "#0388fc"
        highlight: rgba(3, 136, 252, 0.08)
        textHighlight: "#ffc2a877"
      darkMode:
        light: "#0d141c"
        lightgray: "#223042"
        gray: "#6c7a8c"
        darkgray: "#c9d3de"
        dark: "#f1f4f8"
        secondary: "#3aa0ff"
        tertiary: "#7cc0ff"
        highlight: rgba(3, 136, 252, 0.12)
        textHighlight: "#b3502a88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # External links open in a new tab; internal links stay in this tab
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      header:
        name: Figtree
        weights: [500, 600, 700]
      body:
        name: Manrope
        weights: [400, 500, 600, 700]
      code: IBM Plex Mono
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    options:
      # depth -1 would add every page in the site index, including the ~140
      # auto-generated tag pages; a large depth walks real links from the home
      # page instead, which reaches the connected notes only.
      # opacityScale sets when labels fade in while zooming (lower = later);
      # hovering a node always shows its label.
      localGraph:
        depth: 8
        scale: 0.9
        repelForce: 0.6
        centerForce: 0.35
        linkDistance: 32
        fontSize: 0.55
        opacityScale: 0.75
        showTags: false
        focusOnHover: true
      globalGraph:
        depth: 8
        opacityScale: 0.75
        showTags: false
        focusOnHover: true
    layout:
      position: afterBody
      priority: 10
      condition: is-index
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 30
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  byPageType:
    "404":
      template: harbor
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: harbor
    folder:
      template: harbor
      exclude:
        - reader-mode
        - tag-list
      positions:
        right: []
    tag:
      template: harbor
      exclude:
        - reader-mode
        - tag-list
      positions:
        right: []
    canvas: {}
    bases:
      template: harbor
